<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0F6E56" />
<title>网络断开了 · 日常管理</title>
<style>
    :root { --brand: #0F6E56; --bg: #FBF9F4; --ink: #1f2937; --sub: #6b7280; --line: #e5e7eb; }
    @media (prefers-color-scheme: dark) {
        :root { --brand: #4bbf9b; --bg: #14181a; --ink: #e8eeec; --sub: #9aa6a2; --line: #2a3134; }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: var(--bg); color: var(--ink); padding: 28px;
        font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
    }
    .box { width: 100%; max-width: 340px; text-align: center; }
    .mark {
        width: 72px; height: 72px; margin: 0 auto 22px; border-radius: 22px;
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(135deg, #13795F, #0A5343);
    }
    .mark svg { width: 44px; height: 44px; }
    h1 { font-size: 19px; font-weight: 600; letter-spacing: .3px; margin-bottom: 10px; }
    p { font-size: 14px; line-height: 1.75; color: var(--sub); }
    .btn {
        margin-top: 24px; width: 100%; height: 44px; border: 0; border-radius: 12px;
        background: var(--brand); color: #fff; font-size: 15px; font-family: inherit;
        cursor: pointer; transition: opacity .15s;
    }
    .btn:active { opacity: .8; }
    .tip { margin-top: 16px; font-size: 12.5px; color: var(--sub); opacity: .8; }
    .offline-only { display: none; }
    body.is-offline .offline-only { display: block; }
</style>
</head>
<body class="is-offline">
<div class="box">
    <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="112" y="150" width="288" height="250" rx="42" stroke="#fff" stroke-width="30" />
            <path d="M112 192a42 42 0 0 1 42-42h204a42 42 0 0 1 42 42v18H112z" fill="#fff" />
            <rect x="186" y="96" width="34" height="74" rx="17" fill="#fff" />
            <rect x="292" y="96" width="34" height="74" rx="17" fill="#fff" />
            <path d="M180 302l52 52 108-116" stroke="#fff" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
    </div>
    <h1>网络断开了</h1>
    <p>「日常管理」的页面需要联网才能打开。<br />恢复网络后点下面的按钮重试就好。</p>
    <button class="btn" type="button" onclick="location.reload()">重新加载</button>
    <div class="tip offline-only">已检测到离线状态，联网后会自动重试一次</div>
</div>
<script>
    // 联网后自动重试一次，省得用户手动点
    window.addEventListener('online', function () { location.reload(); });
    if (navigator.onLine) document.body.classList.remove('is-offline');
</script>
</body>
</html>
